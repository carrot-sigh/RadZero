model:
  model_class_name: HierarchicalCxrAlignModel

  model_config:
    hierarchy_config:
      contract_path: exp/cxr_pt/configs/hierarchy_contract.json
      num_anatomies: 36
      num_findings: 41
      num_global_labels: 14
      anatomy_projection_dim: 256
      attention_temperature: 0.07
      finding_logit_temperature: 0.07
      global_logit_temperature: 0.07
      finding_chunk_size: 8
      aggregation_num_heads: 8
      aggregation_dropout: 0.0
      empty_mask_policy: all
      loss:
        anatomy_weight: 1.0
        finding_weight: 1.0
        global_weight: 1.0
        anatomy_bce_weight: 1.0
        anatomy_dice_weight: 1.0
        dice_smooth: 1.0
        # Anatomy weights require rasterized mask statistics. Finding/global
        # suggestions are frozen in hierarchy_contract.json for trainer loading.
        anatomy_pos_weight: null
        finding_pos_weight: null
        global_pos_weight: null
      training:
        initial_stage: anatomy
        joint_train_encoders: false
        teacher_forcing_start_ratio: 1.0
        teacher_forcing_end_ratio: 0.0
        teacher_forcing_start_step: 0
        teacher_forcing_end_step: 10000

  module_to_update:
    - anatomy_head
    - finding_head
    - finding_aggregator
    - global_branch
    - evidence_fusion

  # Build the hierarchy model first, then load released RadZero base weights.
  pretrained_state_dict: null

experiment:
  name: hierarchy

dataset:
  hierarchy:
    manifest_path: /home/user/gxq/radzero-data/data/MIMIC-CXR/hierarchy-v1.jsonl
    image_root: /home/user/gxq/Data/mimic-cxr-jpg-2.1.0/files
    contract_path: exp/cxr_pt/configs/hierarchy_contract.json
    patch_grid_size: [37, 37]
    train_split: train
    eval_split: valid
