model:
  model_class_name: HierarchicalCxrAlignModel

  model_config:
    pretrained_dir: /home/user/gxq/radzero-model
    hierarchy_config:
      contract_path: exp/cxr_pt/configs/hierarchy_contract.json
      num_anatomies: 36
      num_findings: 41
      num_global_labels: 14
      attention_temperature: 0.07
      finding_logit_temperature: 0.07
      global_logit_temperature: 0.07
      finding_chunk_size: 8
      # Keep legacy ROI behavior unless an experiment explicitly selects a
      # static or image-conditioned anatomy-finding pair query.
      finding_connection_mode: roi_constraint
      pair_query_num_heads: 8
      pair_query_chunk_size: 64
      pair_query_mlp_dim: 256
      # Mainline: Stage 1 predicted ROI -> Stage 2 masked attention.
      # feature_roi/full_refiner are explicit ablation strategies only.
      finding_roi_strategy: masked_attention
      global_only: false
      feature_roi_size: 14
      feature_roi_context_margin: 0.0
      finding_local_refiner_dim: 128
      aggregation_num_heads: 8
      aggregation_dropout: 0.0
      empty_mask_policy: all
      loss:
        anatomy_weight: 1.0
        finding_weight: 1.0
        global_weight: 1.0
        anatomy_bce_weight: 1.0
        anatomy_dice_weight: 1.0
        dice_smooth: 1.0
        # All weights are computed from the canonical Chest ImaGenome train split.
