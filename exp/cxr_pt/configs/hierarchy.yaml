model:
  model_class_name: HierarchicalCxrAlignModel

  model_config:
    hierarchy_config:
      # Provisional V1 dimensions; vocabulary files will be frozen separately.
      num_anatomies: 25
      num_findings: 43
      num_global_labels: 14
      anatomy_projection_dim: 256
      attention_temperature: 0.07
      finding_logit_temperature: 0.07
      global_logit_temperature: 0.07
      finding_chunk_size: 8
      aggregation_num_heads: 8
      aggregation_dropout: 0.0
      empty_mask_policy: all

  module_to_update:
    - anatomy_head
    - finding_head
    - finding_aggregator
    - global_branch
    - evidence_fusion

  # Build the hierarchy model first, then load released RadZero base weights.
  pretrained_state_dict: null

experiment:
  name: hierarchy
