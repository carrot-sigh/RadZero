      training:
        initial_stage: anatomy
        joint_train_encoders: false
        teacher_forcing_start_ratio: 1.0
        teacher_forcing_end_ratio: 0.0
        teacher_forcing_start_step: 0
        teacher_forcing_end_step: 10000
      # The four phases share the existing 20-epoch budget. Adjust these
      # explicit values per experiment rather than relying on an implicit stage.
      training_schedule:
        - stage: anatomy
          num_train_epochs: 5
        - stage: finding
          num_train_epochs: 5
        - stage: global
          num_train_epochs: 5
        - stage: joint
          num_train_epochs: 5

  module_to_update:
    - anatomy_head
    - finding_head
    - finding_local_refiner
    - finding_aggregator
    - global_branch
    - evidence_fusion

  # Build the hierarchy model first, then load released RadZero base weights.
  pretrained_state_dict: /home/user/gxq/radzero-model

experiment:
  name: hierarchy
  # Required when resume_from_checkpoint points into a staged hierarchy run.
  resume_stage: null

dataset:
